{{ define "main" }}
<section class="section section-dark legal-hero" id="hero">
  <div class="container">
    <p class="eyebrow eyebrow-dark">{{ i18n "legal_kicker" }}</p>
    <h1 class="h2">{{ .Title }}</h1>
    {{- with .Params.sub }}
    <p class="lead lead-dark legal-sub">{{ . }}</p>
    {{- end }}
    {{- with .Params.edition }}
    <p class="legal-edition">{{ . }}</p>
    {{- end }}
  </div>
</section>
<section class="section section-dark legal-body-section">
  <div class="container legal-grid">
    <nav class="legal-toc glass" aria-label="{{ i18n "legal_toc" }}">
      <p class="mini-label mini-label-dark">{{ i18n "legal_toc" }}</p>
      <ol>
        {{- range .Fragments.Headings }}
        <li><a href="#{{ .ID }}">{{ .Title | safeHTML }}</a></li>
        {{- end }}
      </ol>
    </nav>
    <article class="legal-body glass">
      {{ .Content }}
    </article>
  </div>
</section>
{{ end }}
