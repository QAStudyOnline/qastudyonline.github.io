{{- with .Params.final }}
<section class="section section-dark final-cta" id="contact">
  <span class="deco deco-3" aria-hidden="true"></span>
  <div class="container cta-grid">
    <div class="cta-content reveal">
      <p class="eyebrow eyebrow-dark">{{ .eyebrow }}</p>
      <h2 class="h2">{{ .title | safeHTML }}</h2>
      <p class="lead lead-dark">{{ .lead }}</p>
    </div>
    <div class="cta-actions reveal">
      <a class="btn btn-primary btn-xl" href="#programs" data-event="hero_direction_click">{{ .cta }} <span class="arrow" aria-hidden="true">→</span></a>
      <div class="cta-channels">
        <a href="#contact" data-open-form data-event="question_cta_click">
          {{ partial "ui/icon.html" (dict "name" "chat" "class" "ico") }}{{ i18n "ask_question" }}
        </a>
        <span class="sep" aria-hidden="true"></span>
        <a href="{{ site.Params.social.telegram }}" target="_blank" rel="noopener" data-event="telegram_click">
          {{ partial "ui/icon.html" (dict "name" "telegram" "class" "ico") }}Telegram
        </a>
      </div>
    </div>
  </div>
</section>
{{- end }}
