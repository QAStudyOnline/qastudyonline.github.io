# "Коротко про мене"
about:
  - >
    В IT з 2010 року. Пройшов шлях від ручного тестувальника в державному
    проєкті до QA-архітектора, який відповідає за стратегію й архітектуру
    якості в продуктах із мільйонами користувачів.
  - >
    За цей час побудував не один фреймворк і процес з нуля — і бачив, що
    ламається під навантаженням і в реальному продакшені, а не в підручнику.

# "Чим займаюся зараз"
