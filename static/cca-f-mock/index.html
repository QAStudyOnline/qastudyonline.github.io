<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCA-F Exam Simulator — Claude Certified Architect Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --paper:#F4F7FB; --panel:#FFFFFF; --ink:#101B2D; --muted:#5B6B85;
    --line:#DCE3EE; --accent:#2B50E2; --accent-soft:#E8EDFD;
    --amber:#E8930C; --amber-soft:#FDF3E2;
    --green:#178A5B; --green-soft:#E4F5EE;
    --red:#CE4444; --red-soft:#FBEAEA;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Space Grotesk',sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
  button{font-family:inherit;cursor:pointer}
  #root{min-height:100vh;display:flex;flex-direction:column}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
  .brand{font-family:var(--mono);font-size:13px;letter-spacing:.08em;display:flex;align-items:center;gap:10px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}
  .timer{font-family:var(--mono);font-size:15px;font-weight:600;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.1)}
  .timer.low{background:var(--red);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  @media (prefers-reduced-motion: reduce){ .timer.low{animation:none} }

  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:24px 20px;flex:1}

  /* ---------- start screen ---------- */
  .hero h1{font-family:var(--disp);font-size:clamp(28px,5vw,44px);font-weight:700;line-height:1.1;margin-bottom:8px}
  .hero .sub{color:var(--muted);max-width:620px;margin-bottom:20px}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
  .fact{font-family:var(--mono);font-size:12.5px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
  .fact b{color:var(--accent)}
  .domains{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:24px}
  .domains h2{font-family:var(--disp);font-size:17px;margin-bottom:14px}
  .drow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:12px}
  .drow .name{font-size:14px;font-weight:500}
  .drow .pct{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--paper);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
  .modes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .mode{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;transition:border-color .15s, transform .15s}
  .mode:hover{border-color:var(--accent);transform:translateY(-2px)}
  .mode:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .mode .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;display:block;margin-bottom:6px}
  .mode h3{font-family:var(--disp);font-size:19px;margin-bottom:6px}
  .mode p{font-size:13.5px;color:var(--muted)}
  .disclaimer{margin-top:26px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

  /* ---------- exam layout ---------- */
  .exam{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
  @media(max-width:760px){.exam{grid-template-columns:1fr}}

  /* answer sheet (scantron) — the signature element */
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:70px}
  @media(max-width:760px){.sheet{position:static}}
  .sheet h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px}
  .cell{font-family:var(--mono);font-size:11.5px;height:30px;border-radius:6px;border:1px solid var(--line);
    background:var(--paper);color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative}
  .cell.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .cell.current{outline:2px solid var(--ink);outline-offset:1px}
  .cell.flagged::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
  .cell.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .cell.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
  .cell:focus-visible{outline:3px solid var(--accent)}
  .legend{margin-top:12px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .legend span{display:flex;align-items:center;gap:6px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* question card */
  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
  .qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
  .qnum{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .flagbtn{margin-left:auto;font-size:12.5px;font-family:var(--mono);border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:5px 12px;color:var(--muted)}
  .flagbtn.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
  .stem{font-size:16.5px;font-weight:500;margin-bottom:18px;line-height:1.5}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:12px 14px;font-size:14.5px;line-height:1.5;transition:border-color .12s}
  .opt:hover{border-color:var(--accent)}
  .opt:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  .opt .key{font-family:var(--mono);font-size:12px;font-weight:600;min-width:22px;height:22px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;flex-shrink:0;margin-top:1px}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.correct .key{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt.wrong .key{background:var(--red);border-color:var(--red);color:#fff}
  .explain{margin-top:16px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px}
  .explain b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--accent)}

  .nav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .btn{border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:#1F3FC4}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.danger{background:var(--ink);color:#fff;margin-left:auto}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* results */
  .score-hero{background:var(--ink);color:#fff;border-radius:14px;padding:28px 24px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
  .score-big{font-family:var(--disp);font-size:clamp(44px,8vw,68px);font-weight:700;line-height:1}
  .score-big small{font-size:18px;color:#9AA8C2;font-weight:500}
  .verdict{font-family:var(--mono);font-size:13px;letter-spacing:.1em;padding:8px 16px;border-radius:20px}
  .verdict.pass{background:var(--green);color:#fff}
  .verdict.fail{background:var(--red);color:#fff}
  .score-meta{font-family:var(--mono);font-size:13px;color:#9AA8C2;width:100%}
  .dstats{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:22px}
  .dstats h2,.review h2{font-family:var(--disp);font-size:18px;margin-bottom:14px}
  .review .qcard{margin-bottom:14px}
  .modal{position:fixed;inset:0;background:rgba(16,27,45,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal .box{background:var(--panel);border-radius:14px;padding:24px;max-width:420px;width:100%}
  .modal h3{font-family:var(--disp);font-size:20px;margin-bottom:8px}
  .modal p{font-size:14px;color:var(--muted);margin-bottom:18px}
  .modal .nav{margin-top:0}
</style>
</head>

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
// proportional sample per official domain weights
function buildExam(n){
  const byD = DOMAINS.map(d=>shuffle(BANK.filter(q=>q.d===d.id)));
  if(n>=BANK.length) return shuffle(BANK);
  const quota = DOMAINS.map(d=>Math.floor(n*d.w/100));
  let rem = n - quota.reduce((s,x)=>s+x,0);
  const fracs = DOMAINS.map((d,i)=>({i,f:(n*d.w/100)%1})).sort((a,b)=>b.f-a.f);
  for(let k=0;k<rem;k++) quota[fracs[k].i]++;
  const picked=[];
  quota.forEach((q,i)=>picked.push(...byD[i].slice(0,q)));
  return shuffle(picked);
}

function Sheet({qs,answers,flags,current,goTo,results}){
  return (
    <aside className="sheet">
      <h4>Answer sheet</h4>
      <div className="cells">
        {qs.map((q,i)=>{
          let cls="cell";
          if(results) cls += answers[i]===q.a ? " good":" bad";
          else if(answers[i]!=null) cls+=" answered";
          if(i===current) cls+=" current";
          if(flags.has(i)) cls+=" flagged";
          return <button key={i} className={cls} onClick={()=>goTo(i)} aria-label={`Question ${i+1}`}>{i+1}</button>;
        })}
      </div>
      {!results &&
        <div className="legend">
          <span><i className="sw" style={{background:"var(--accent-soft)",border:"1px solid var(--accent)"}}/>answered</span>
          <span><i className="sw" style={{background:"var(--amber)"}}/>flagged</span>
        </div>}
    </aside>
  );
}

function Question({q,idx,total,answer,onAnswer,flagged,toggleFlag,feedback,reviewMode}){
  const dom = DOMAINS.find(d=>d.id===q.d);
  const showFB = reviewMode || (feedback && answer!=null);
  return (
    <div className="qcard">
      <div className="qmeta">
        <span className="chip">D{q.d} · {dom.name}</span>
        <span className="qnum">{idx+1} / {total}</span>
        {!reviewMode &&
          <button className={"flagbtn"+(flagged?" on":"")} onClick={toggleFlag} aria-pressed={flagged}>
            {flagged?"● flagged":"○ flag"}
          </button>}
      </div>
      <p className="stem">{q.q}</p>
      <div className="opts" role="radiogroup" aria-label="answer options">
        {q.o.map((opt,oi)=>{
          let cls="opt";
          if(showFB){
            if(oi===q.a) cls+=" correct";
            else if(oi===answer) cls+=" wrong";
          } else if(oi===answer) cls+=" sel";
          return (
            <button key={oi} className={cls} role="radio" aria-checked={answer===oi}
              disabled={reviewMode || (feedback && answer!=null)}
              onClick={()=>onAnswer(oi)}>
              <span className="key">{KEYS[oi]}</span><span>{opt}</span>
            </button>
          );
        })}
      </div>
      {showFB &&
        <div className="explain">
          <b>{answer===q.a ? "Correct" : "Correct answer: "+KEYS[q.a]}</b>
          {q.e}
        </div>}
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState("start"); // start | exam | results
  const [mode,setMode]=useState(null);
  const [qs,setQs]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [flags,setFlags]=useState(new Set());
  const [cur,setCur]=useState(0);
  const [secs,setSecs]=useState(0);
  const [confirm,setConfirm]=useState(false);
  const timerRef=useRef(null);

  const start = key=>{
    const m=MODES[key];
    const exam=buildExam(m.n);
    setMode(key); setQs(exam); setAnswers(Array(exam.length).fill(null));
    setFlags(new Set()); setCur(0); setSecs(m.mins*60); setScreen("exam");
    window.scrollTo(0,0);
  };
  const finish = ()=>{ setConfirm(false); setScreen("results"); window.scrollTo(0,0); };

  useEffect(()=>{
    if(screen!=="exam" || !mode || MODES[mode].mins===0) return;
    timerRef.current=setInterval(()=>setSecs(s=>{
      if(s<=1){clearInterval(timerRef.current); finish(); return 0;}
      return s-1;
    }),1000);
    return ()=>clearInterval(timerRef.current);
  },[screen,mode]);

  const setAns=oi=>setAnswers(a=>{const b=[...a];b[cur]=oi;return b;});
  const toggleFlag=()=>setFlags(f=>{const g=new Set(f); g.has(cur)?g.delete(cur):g.add(cur); return g;});

  const correct = useMemo(()=>qs.reduce((s,q,i)=>s+(answers[i]===q.a?1:0),0),[qs,answers]);
  const unanswered = answers.filter(a=>a==null).length;

  if(screen==="start") return (
    <>
      <header className="topbar"><span className="brand"><span className="dot"/>CCA-F // EXAM SIMULATOR</span></header>
      <main className="wrap">
        <section className="hero">
          <h1>Claude Certified Architect — Foundations</h1>
          <p className="sub">An unofficial exam simulator mirroring the official CCA-F guide: scenario-based multiple choice across the five weighted domains, scored on the 100–1000 scale with a 720 pass mark.</p>
          <div className="facts">
            <span className="fact"><b>60</b> questions</span>
            <span className="fact"><b>{BANK.length}</b>-question pool</span>
            <span className="fact"><b>120</b> minutes</span>
            <span className="fact">pass ≥ <b>720</b>/1000</span>
            <span className="fact"><b>4</b> of 6 scenarios</span>
            <span className="fact">fee <b>$125</b></span>
            <span className="fact">valid <b>12</b> months</span>
          </div>
        </section>
        <section className="domains">
          <h2>Official domain weights</h2>
          {DOMAINS.map(d=>(
            <div className="drow" key={d.id}>
              <span className="name">D{d.id} — {d.name}</span>
              <span className="pct">{d.w}%</span>
              <span className="bar"><i style={{width:d.w/27*100+"%"}}/></span>
            </div>
          ))}
        </section>
        <section className="modes">
          {Object.entries(MODES).map(([k,m])=>(
            <button key={k} className="mode" onClick={()=>start(k)}>
              <span className="tag">{m.tag}</span>
              <h3>{m.label}</h3>
              <p>{m.desc}</p>
            </button>
          ))}
        </section>
        <p className="disclaimer">Unofficial study tool — not affiliated with or endorsed by Anthropic. All questions are original, written from the public CCA-F Exam Guide v0.2 (June 30, 2026): its domains, weightings, task statements, and in-scope topic list. No real exam content is reproduced — actual exam questions are confidential under the Anthropic Certification Exam Policy. In exam modes, each question must be answered before advancing, as on the official platform. Explanations are AI-generated study aids and may contain errors — verify them against official Anthropic documentation. For the official practice exam, request access at anthropic.skilljar.com.</p>
      </main>
    </>
  );

  if(screen==="exam"){
    const m=MODES[mode];
    return (
      <>
        <header className="topbar">
          <span className="brand"><span className="dot"/>{m.label.toUpperCase()} · {qs.length} Q</span>
          {m.mins>0 ? <Timer secs={secs}/> : <span className="timer">UNTIMED</span>}
        </header>
        <main className="wrap">
          <div className="exam">
            <Sheet qs={qs} answers={answers} flags={flags} current={cur} goTo={setCur}/>
            <div>
              <Question q={qs[cur]} idx={cur} total={qs.length} answer={answers[cur]}
                onAnswer={setAns} flagged={flags.has(cur)} toggleFlag={toggleFlag} feedback={m.feedback}/>
              <div className="nav">
                <button className="btn ghost" disabled={cur===0} onClick={()=>setCur(c=>c-1)}>← Previous</button>
                <button className="btn primary" disabled={cur===qs.length-1 || (!m.feedback && answers[cur]==null)}
                  title={!m.feedback && answers[cur]==null ? "The official exam platform requires an answer before advancing" : undefined}
                  onClick={()=>setCur(c=>c+1)}>Next →</button>
                <button className="btn danger" onClick={()=>setConfirm(true)}>Submit exam</button>
              </div>
            </div>
          </div>
        </main>
        {confirm &&
          <div className="modal" role="dialog" aria-modal="true">
            <div className="box">
              <h3>Submit exam?</h3>
              <p>{unanswered>0 ? `${unanswered} question${unanswered>1?"s are":" is"} still unanswered and will be scored as incorrect.` : "All questions answered."}</p>
              <div className="nav">
                <button className="btn ghost" onClick={()=>setConfirm(false)}>Keep working</button>
                <button className="btn primary" onClick={finish}>Submit</button>
              </div>
            </div>
          </div>}
      </>
    );
  }

  // results
  const score=scaled(correct,qs.length);
  const pass=score>=720;
  return (
    <>
      <header className="topbar"><span className="brand"><span className="dot"/>RESULTS</span></header>
      <main className="wrap">
        <section className="score-hero">
          <div className="score-big">{score}<small> /1000</small></div>
          <span className={"verdict "+(pass?"pass":"fail")}>{pass?"PASS":"FAIL"} · cut 720</span>
          <div className="score-meta">{correct} of {qs.length} correct ({Math.round(correct/qs.length*100)}%) · {MODES[mode].label}</div>
        </section>
        <section className="dstats">
          <h2>Performance by domain</h2>
          {DOMAINS.map(d=>{
            const dq=qs.map((q,i)=>({q,i})).filter(x=>x.q.d===d.id);
            if(!dq.length) return null;
            const c=dq.filter(x=>answers[x.i]===x.q.a).length;
            const pct=Math.round(c/dq.length*100);
            return (
              <div className="drow" key={d.id}>
                <span className="name">D{d.id} — {d.name}</span>
                <span className="pct">{c}/{dq.length} · {pct}%</span>
                <span className="bar"><i style={{width:pct+"%",background:pct>=70?"var(--green)":"var(--red)"}}/></span>
              </div>
            );
          })}
        </section>
        <section className="review">
          <h2>Review all questions</h2>
          {qs.map((q,i)=>(
            <Question key={i} q={q} idx={i} total={qs.length} answer={answers[i]} onAnswer={()=>{}} reviewMode/>
          ))}
        </section>
        <div className="nav" style={{marginBottom:32}}>
          <button className="btn primary" onClick={()=>setScreen("start")}>Back to start</button>
          <button className="btn ghost" onClick={()=>start(mode)}>Retake ({MODES[mode].label})</button>
        </div>
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
